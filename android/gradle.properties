org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Kotlin incremental cache is unstable on this machine (Windows 11 + AGP 9.5.2 + Gradle 9.6.0).
# Symptom: "Could not close incremental caches ... class-fq-name-to-source.tab" on
# :shared_preferences_android:compileReleaseKotlin, and `flutter clean` does not help.
# Disabling incremental + in-process compilation makes builds stable (~30-40s slower).
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
